<!doctype html>
<!-- translate="no" for the same reason the congregation's page carries it: this document
     says it is Hebrew, so a phone offers to turn it into English, and a generator whose
     column headings and minyan names have been machine translated builds a board out of
     words that are not the shul's. See index.html for the whole of it. -->
<html lang="he" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Zmanim Sheet Generator (admin)</title>
<!-- Kept out of search. This is the tool the board is built with, not something a member of
     the shul is ever looking for, and once the site sits on a domain carrying the shul's own
     name it will otherwise be found. Nothing here is secret (publishing needs a GitHub token
     that lives in one browser), but a generator turning up under the shul's name would only
     confuse somebody after the zmanim. robots.txt asks crawlers not to visit; this tag is
     what covers the case where one arrives anyway, through a link rather than the root. -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/app.css?v=a1630d6c">
<link rel="stylesheet" href="css/print.css?v=24d6011d" media="print">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar no-print">
    <div class="sidebar-brand">
      <img class="sidebar-mark" src="assets/logo-building-icon.png" alt="">
      <span class="sidebar-title">Zmanim<small>Sheet Generator</small></span>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <span class="sidebar-site">lczmanim.cjaffa.com</span>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script src="bundle.js"></script>
<script>
// Opening this file straight off the disk gives a blank page and no clue why: under
// file:// the browser refuses both ES modules and fetch(), so none of the app's code
// runs at all and there is nothing left to report the problem. The offline/ build exists
// for exactly that case. Deliberately a plain script, since a module would be blocked
// alongside everything else, and it only speaks up if the app really did fail to start.
window.addEventListener('DOMContentLoaded', function () {
  if (location.protocol !== 'file:') return;
  setTimeout(function () {
    var main = document.getElementById('main');
    if (!main || main.children.length) return; // it booted (the offline build does)
    main.innerHTML =
      '<h2>Open the offline copy instead</h2>' +
      '<p class="hint">This is the version of the site meant to be served over the web, and a browser will not run it straight off the disk. There is a copy built to work this way.</p>' +
      '<p class="hint">Go up one folder and open <strong>offline</strong>, then <strong>index.html</strong> inside it. Everything works the same there, with no internet needed.</p>' +
      '<p class="hint">Or use the live site: <strong>lczmanim.cjaffa.com</strong></p>';
  }, 500);
});
</script>
</body>
</html>
