<!-- lang was "he", which was wrong in the way that matters here: the words on this page a
     search engine can use are English, and declaring the whole document Hebrew tells it to
     read them as Hebrew and tells a screen reader to say them in a Hebrew voice. The Hebrew
     that is here is names and headings, marked where it sits. Nothing in the CSS or the JS
     keys off this attribute, so it is only ever read by things outside the page.

     translate="no" is the other half of that, and it is here because a phone did it: with
     a page carrying both scripts, Chrome offered to translate and made "ליקוואוד קאמענס"
     into "Liquid Commons" and "Zelle" into "Cell". The second is on the donation page,
     where somebody looking for the way they pay is now looking for a word the shul has
     never used.

     It is the whole document rather than the names one at a time, and that is on purpose.
     Nearly everything here is a name: the shul's, the town's, the minyanim, the funds, the
     payment services, and the printed board is Hebrew from end to end. What is left that a
     translation could help with is about three sentences of description. Marking the names
     one by one means being right every time, forever, including in whatever gets added
     next, and the cost of missing one is what these screenshots are. So the rule is the
     simple one: nothing on this site is translated.

     The attribute is the standard one and is what Google Translate reads. The meta tag
     below is Google's own way of saying it and stops the offer being made at all, so a
     visitor is not invited to break the page and then left wondering why the shul calls it
     Cell. Both, because they are read by different parts of the same thing. -->

<!-- The safety net for the stand-in below, and only that. See the <noscript> in <main>.
     Each page carries a plain-HTML version of itself for a reader with JavaScript off and for
     a crawler that does not run it, and the app throws it away on load. It is inside <noscript>
     because a browser that is running the app then never renders it at all: no class to set,
     no stylesheet to wait for, and no window in which the wrong page can paint. That is worth
     having outright rather than by arrangement, since what it replaced was a flash the shul
     saw on a phone: the week page read like the wrong page for 4.6 seconds over fast 3G.
     This timer is for the other case. If the app never arrives, because a module 404s or a
     network hangs, the plain page is written back in rather than leaving a header over nothing.
     Forty-five seconds, and the number is measured rather than picked: it was twenty, and on a
     phone over slow 3G the app itself does not finish until around twenty-five, so the net was
     firing on a load that was merely slow and putting the stand-in on the screen just before
     the real page arrived. It has to be past the worst honest load and short of forever. -->
<script>setTimeout(function(){var m=document.getElementById('main');var n=m&&m.querySelector('noscript.preapp');if(n){m.innerHTML=n.textContent;}},45000);</script>
