# Local-dev-only config for the maaser worker. Not needed to deploy for real (the docblock at
# the top of maaser-worker.js deploys by pasting into the dashboard instead, the same way
# traffic-worker.js does), but `wrangler dev --local --config worker/wrangler.maaser.toml` from
# the repo root brings the Worker up against a local SQLite copy of the D1 schema for testing
# without touching the shul's real account.
name = "maaser-tracker-dev"
main = "maaser-worker.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "MAASER_DB"
database_name = "maaser-tracker-dev"
database_id = "local-dev"
