name: Build the program

# Started by hand from the Actions tab, never on a push. A build takes a few minutes and is
# only wanted when there is a version to hand to someone, not on every commit. Each build
# leaves its program as an artifact on the run, which is where to download it from.
#
# Three come out, because a program cannot be built for a machine unlike the one building it:
#   Zmanim-windows        Zmanim.exe, for Windows
#   Zmanim-mac-intel      Zmanim.app, for a Mac with an Intel processor
#   Zmanim-mac-apple      Zmanim.app, for a Mac with Apple silicon (M1 and later)
# The Release carries a fourth, Zmanim-offline.zip: the browser copy from offline/, which
# runs anywhere a browser does and is the answer for a machine with no build of its own.
# An Apple silicon Mac can also run the Intel one through Rosetta, but not the other way
# round, so the Intel build is the one to send when it is not known which Mac it is for.
#
# A finished build is also published as a Release, which is what the website's Get the
# program tab links to. An artifact cannot be linked to from a web page: downloading one
# needs a GitHub account with access to this repository, and it is deleted after 90 days. A
# Release asset is a plain public link that does not expire, and
# .../releases/latest/download/NAME always points at the newest one, so the website never
# has to be edited when a new build goes out.
on:
  workflow_dispatch:
    inputs:
      label:
        description: A note to put on the download, so a run can be told apart later
        required: false
        default: ""
      publish:
        description: Publish as a Release, which is what the website's download links point at
        type: boolean
        required: false
        default: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what it needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials PyMuPDF pyinstaller

      # The tests run first, on Windows, against the golden fixture. If the numbers are wrong
      # there is nothing worth building: the engine is a port, and a port that disagrees with
      # fixtures/golden.json is wrong whatever it looks like on paper.
      - name: Check the engine and the pages
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python desktop/tests/test_golden.py
          python desktop/tests/test_chart_layout.py
          python desktop/tests/test_card_layout.py
          python desktop/tests/test_state.py
          python desktop/tests/test_week.py
          python desktop/tests/test_settings.py
          python desktop/tests/test_editor.py
          python desktop/tests/test_sheet_view.py
          python desktop/tests/test_guide.py
          python desktop/tests/test_publish.py

      # The Hebrew calendar tables, the fonts and the header images all have to travel inside
      # the program: it must work with no network and nothing sitting beside it.
      # engine/tables.py, render/fonts.py and render/chart.py all look in sys._MEIPASS first
      # for exactly this reason.
      #
      # Two asset folders, not one, and both are needed. desktop/zmanimboard/assets holds the
      # TTF fonts, which exist only here because Qt cannot read the WOFF2 the website ships.
      # The repository's own assets folder holds the header images, which are shared with the
      # website and are not duplicated. Bundling only the first one built a program that
      # opened and then crashed the moment it drew a chart, on the missing logo. Both land in
      # the same place inside the program, which is what render/*.py look for.
      - name: Build the program
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Zmanim
          --paths desktop
          --add-data "desktop/zmanimboard/assets;assets"
          --add-data "assets;assets"
          --add-data "data;data"
          desktop/run.py

      # The suites above run against the source tree, where the fonts and the tables are
      # simply files on disk. This runs the built program itself, which has to find them
      # inside itself: a packaging mistake leaves every suite green and hands over a program
      # that opens to a blank chart.
      # Start-Process -Wait rather than calling it directly. The program is built --windowed,
      # which on Windows means it is a GUI program, and PowerShell does not wait for one of
      # those: it read a stale $LASTEXITCODE and threw two seconds before the program had
      # even finished printing that everything had passed.
      - name: Start the built program and draw a board with it
        run: |
          if (-not (Test-Path dist/Zmanim.exe)) { throw "no exe was produced" }
          $size = (Get-Item dist/Zmanim.exe).Length / 1MB
          Write-Host ("Zmanim.exe is {0:N1} MB" -f $size)
          $run = Start-Process -FilePath dist/Zmanim.exe -ArgumentList "--selftest" -NoNewWindow -Wait -PassThru
          Write-Host ("it exited with {0}" -f $run.ExitCode)
          if ($run.ExitCode -ne 0) { throw "the built program failed its own check" }

      - uses: actions/upload-artifact@v4
        with:
          name: Zmanim-windows${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: dist/Zmanim.exe
          if-no-files-found: error
          retention-days: 90

  mac:
    # Both kinds of Mac, because a build for one will not run on the other. fail-fast is off
    # so that one of them being unavailable still leaves the other downloadable, which is not
    # hypothetical: macos-13 sat queued for twenty minutes without ever being given a machine,
    # so the Intel build asks for macos-15-intel instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            kind: intel
          - runner: macos-latest
            kind: apple
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what it needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials PyMuPDF pyinstaller

      - name: Check the engine and the pages
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for suite in golden chart_layout card_layout state week settings editor sheet_view guide publish; do
            python desktop/tests/test_$suite.py || exit 1
          done

      # Same as the Windows build but for the separator in --add-data, which is a colon here
      # and a semicolon there. A Mac program is a folder, Zmanim.app, rather than one file.
      - name: Build the program
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Zmanim
          --paths desktop
          --add-data "desktop/zmanimboard/assets:assets"
          --add-data "assets:assets"
          --add-data "data:data"
          desktop/run.py

      - name: Start the built program and draw a board with it
        run: |
          test -d dist/Zmanim.app || { echo "no app was produced"; exit 1; }
          du -sh dist/Zmanim.app
          ./dist/Zmanim.app/Contents/MacOS/Zmanim --selftest

      # Zipped here rather than left to the upload step, which does not keep file permissions.
      # Unzipped without the executable bit on Contents/MacOS/Zmanim, the app does not open at
      # all, so the download would be a folder that refuses to start. ditto is the tool that
      # keeps it, and is what the Finder itself uses to make a zip.
      - name: Wrap the app so it survives the trip
        run: ditto -c -k --sequesterRsrc --keepParent dist/Zmanim.app dist/Zmanim-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Zmanim-mac-${{ matrix.kind }}${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: dist/Zmanim-mac.zip
          if-no-files-found: error
          retention-days: 90

  # The three programs, published where they can simply be linked to. Only when all three
  # built: a Release offering two of them, with the third quietly missing, is worse than no
  # new Release, because the website's links are what people follow.
  release:
    needs: [windows, mac]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checked out for offline/, which is the fourth thing published: the browser copy for a
      # USB stick. It is build output committed to the repository, so there is nothing to
      # build here, only something to zip.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      # Renamed to fixed names, because the website links by name:
      # .../releases/latest/download/Zmanim.exe has to keep working for every future build,
      # so the name cannot carry a version or the label from the run.
      - name: Name them what the website asks for
        run: |
          mkdir -p out
          cp downloaded/Zmanim-windows*/Zmanim.exe        out/Zmanim.exe
          cp downloaded/Zmanim-mac-intel*/Zmanim-mac.zip  out/Zmanim-mac-intel.zip
          cp downloaded/Zmanim-mac-apple*/Zmanim-mac.zip  out/Zmanim-mac-apple.zip
          ls -lh out

      # The browser copy. Zipped with the folder inside it rather than its contents loose, so
      # unzipping gives one folder called Zmanim-offline holding index.html, and not a dozen
      # files scattered into whatever folder it was unzipped in.
      - name: Wrap the browser copy
        run: |
          test -f offline/index.html || { echo "offline/ is missing or was never built"; exit 1; }
          cp -r offline Zmanim-offline
          zip -qr out/Zmanim-offline.zip Zmanim-offline
          unzip -l out/Zmanim-offline.zip | tail -3

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          NOTES=$(cat <<'TEXT'
          The zmanim board program, one file, nothing to install.

          | Download | For |
          | --- | --- |
          | `Zmanim.exe` | Windows, 64 bit |
          | `Zmanim-mac-apple.zip` | a Mac with Apple silicon, M1 and later |
          | `Zmanim-mac-intel.zip` | a Mac with an Intel processor |
          | `Zmanim-offline.zip` | any computer, opened in a browser, with no internet |

          Not sure which Mac: Apple menu, About This Mac. An Apple silicon Mac will also run
          the Intel one through Rosetta, but an Intel Mac cannot run the Apple silicon one.

          **The first time on a computer**, none of the three programs will open, because none
          is signed with a paid certificate. On Windows: More info, then Run anyway. On a Mac:
          System Settings, Privacy & Security, then Open Anyway on the line naming Zmanim. Once
          per computer, not every time. The browser copy has nothing to get past: unzip it and
          open index.html.

          Run from a USB stick it keeps its boards on the stick, so the same stick opens with
          your work on any computer you carry it to.

          Every build runs all ten test suites on the machine that builds it, then starts the
          program it just made and has it draw a board, write a PDF and write the save file.
          TEXT
          )
          # --repo and --target because this job never checks the repository out: it only
          # collects what the three build jobs made. Without them gh looks for a .git folder
          # in an empty working directory and gives up.
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Zmanim boards, $(date -u +'%-d %B %Y')" \
            --notes "$NOTES"
          echo "published $TAG"
