name: Deploy private calendar service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-service
  cancel-in-progress: false

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check calendar validation and Google bridge
        run: node --test tests/calendar-model.mjs tests/calendar-announcements.mjs tests/calendar-email-import.mjs
      - name: Install the pinned calendar deployment tool
        run: npm ci --prefix worker/calendar --no-audit --no-fund
      - name: Verify announcement dates and congregation history with isolated local records
        run: node tests/calendar-announcement-dates.cjs
      - name: Deploy only the existing calendar service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The repository has no Cloudflare deployment credential. Use CODEX-DESKTOP-LC-TEXT-CONNECTION.txt on the authorized computer."
            exit 1
          fi
          worker/calendar/node_modules/.bin/wrangler deploy --config worker/calendar/wrangler.jsonc
      - name: Verify the existing private service without creating data
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const endpoint=JSON.parse(fs.readFileSync('data/calendar.json','utf8')).endpoint;
          const headers={Origin:'https://baismedrashoflakewoodcommons.org'};
          let response;
          for(let attempt=0;attempt<5;attempt++){
            response=await fetch(endpoint+'/api/info',{headers});
            if(response.ok&&(await response.clone().json()).emailImport||attempt===4)break;
            await response.body?.cancel();
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          assert.equal(response.status,200);
          const info=await response.json();
          for(const field of ['ready','private','accounts','announcements','announcementDeletion','announcementEditing','announcementDateEditing','loginHistory','selfRegistration','activityStatistics','emailImport'])assert.equal(info[field],true,field);
          assert.equal(info.announcementHistoryDays,10);
          for(const path of ['/api/events?from=2026-11-01&to=2026-11-30','/api/announcements','/api/email-import','/api/email-import/review']){
            const denied=await fetch(endpoint+path,{headers});assert.equal(denied.status,401,path);await denied.body?.cancel();
          }
          const receipt=await fetch(endpoint+'/api/email-import/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({heartbeat:true})});
          assert.equal(receipt.status,401,'Inbox requests need their separate private key');await receipt.body?.cancel();
          const unrelated=await fetch(endpoint+'/api/info',{headers:{Origin:'https://unrelated.example'}});
          assert.equal(unrelated.status,403);await unrelated.body?.cancel();
          console.log('Verified the existing owner, calendar features, LC Text capability and private access. No calendar data was written.');
          JS
