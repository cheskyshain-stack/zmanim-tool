# Publishing the congregation's site.
#
# What is on lczmanim.cjaffa.com is dist/, the copy build-offline.py writes with every comment
# taken out, and not the repository root. The two are the same site, and the difference is that
# this repository's reasoning is in the root and is nobody's download: comments were 54% of what
# a visitor was fetching, and they are the thinking behind every decision here, readable in
# devtools by anybody who opened the page.
#
# It has to be a workflow rather than a setting. GitHub Pages will publish a branch's root or
# its /docs, and dist/ is neither. It is also gitignored, because it is build output and the
# thing that should be reviewed in a commit is the source it came out of.
#
# So the build runs here instead of being trusted from a commit, which also means the site can
# never be a rebuild behind the source it was built from. build-offline.py is standard library
# only, so this needs nothing installed.
#
# The comment stripping is not checked here because it is checked there: build-offline.py
# refuses to write dist/ at all if its own scanners still find a comment in the output, so a
# stripper that missed something fails this job rather than publishing.

name: Publish the site

on:
  push:
    branches: [main]
  # So the site can be republished without a commit, which is the thing to reach for if a
  # deployment is ever lost or half done.
  workflow_dispatch:
  # Refresh the ten-day API after New York midnight during either DST offset.
  schedule:
    - cron: '7 4,5 * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push wins. Two pushes a minute apart should not race
# over which of them the site ends up being.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the site
        run: python build-offline.py

      - name: Build the ten-day schedule API
        run: node scripts/build-schedule-api.mjs

      - name: Verify the schedule API and special-day rules
        run: node --test tests/schedule-feed.mjs tests/asara-bteves.mjs tests/shacharis-handouts.mjs

      - name: Verify calendar addresses and private account links
        run: node --test tests/calendar-address.mjs tests/admin-analytics.mjs

      - uses: actions/configure-pages@v5

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: ${{ env.PAGES_ARTIFACT }}

      - name: Wait for the uploaded site to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          node --input-type=module <<'JS'
          const {GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID, GH_TOKEN, PAGES_ARTIFACT, PAGES_ARTIFACT_ID} = process.env;
          const url = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100`;
          for (let attempt = 0; attempt < 20; attempt++) {
            await new Promise(resolve => setTimeout(resolve, 3000));
            const response = await fetch(url, {
              headers: {Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json'},
              cache: 'no-store', signal: AbortSignal.timeout(10000),
            });
            if (response.ok) {
              const {artifacts} = await response.json();
              const matches = artifacts.filter(artifact => artifact.name === PAGES_ARTIFACT && !artifact.expired);
              if (matches.length === 1 && String(matches[0].id) === PAGES_ARTIFACT_ID) {
                console.log('The uploaded site is ready to publish.');
                process.exit(0);
              }
            } else {
              await response.body?.cancel();
              if (![429, 500, 502, 503, 504].includes(response.status)) {
                throw Error(`Could not verify the uploaded site: HTTP ${response.status}`);
              }
            }
          }
          throw Error('The uploaded site is not yet visible. Retry this publishing job.');
          JS

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
