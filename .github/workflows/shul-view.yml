name: Deploy Shul View

on:
  push:
    branches: [feature/tv-display]

permissions:
  contents: read

concurrency:
  group: shul-view-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify the congregation schedule source
        run: node --test tests/congregation-source.test.mjs
      - name: Build the TV assets
        run: npm run build
      - name: Deploy the existing Shul View Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHUL_VIEW_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f9fc2e8063dd01b7fe17fa6e056d211a
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the SHUL_VIEW_DEPLOY_TOKEN GitHub Actions secret."
            exit 1
          fi
          ./node_modules/.bin/wrangler deploy --config wrangler.builds.jsonc
      - name: Verify the live TV uses the congregation schedule
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as wait } from 'node:timers/promises';
          const origin = 'https://baismedrashoflakewoodcommons.org';
          const page = await fetch(origin + '/tv/', { signal: AbortSignal.timeout(10000) });
          if (!page.ok) throw new Error('The TV page returned HTTP ' + page.status);
          await page.body?.cancel();
          for (let attempt = 0; attempt < 8; attempt++) {
            const response = await fetch(origin + '/api/display/offline?build=' + Date.now(), {
              signal: AbortSignal.timeout(10000),
            });
            const seed = response.ok ? await response.json() : null;
            if (Array.isArray(seed?.publishedSchedule?.sheets)) {
              console.log('The live TV received published congregation settings.');
              process.exit(0);
            }
            await wait(3000);
          }
          throw new Error('The live TV did not receive the congregation schedule.');
          JS
